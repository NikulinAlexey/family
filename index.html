<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Дела</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="layout">
        <header class="header">
            <div class="container">
                <h1>Дела</h1><button class="history" id="history"><svg
                        xmlns="http://www.w3.org/2000/svg" 
                         viewBox="0 0 24 24" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M5.01112 11.5747L6.29288 10.2929C6.68341 9.90236 7.31657 9.90236 7.7071 10.2929C8.09762 10.6834 8.09762 11.3166 7.7071 11.7071L4.7071 14.7071C4.51956 14.8946 4.26521 15 3.99999 15C3.73477 15 3.48042 14.8946 3.29288 14.7071L0.292884 11.7071C-0.0976406 11.3166 -0.0976406 10.6834 0.292884 10.2929C0.683408 9.90236 1.31657 9.90236 1.7071 10.2929L3.0081 11.5939C3.22117 6.25933 7.61317 2 13 2C18.5229 2 23 6.47715 23 12C23 17.5228 18.5229 22 13 22C9.85817 22 7.05429 20.5499 5.22263 18.2864C4.87522 17.8571 4.94163 17.2274 5.37096 16.88C5.80028 16.5326 6.42996 16.599 6.77737 17.0283C8.24562 18.8427 10.4873 20 13 20C17.4183 20 21 16.4183 21 12C21 7.58172 17.4183 4 13 4C8.72441 4 5.23221 7.35412 5.01112 11.5747ZM13 5C13.5523 5 14 5.44772 14 6V11.5858L16.7071 14.2929C17.0976 14.6834 17.0976 15.3166 16.7071 15.7071C16.3166 16.0976 15.6834 16.0976 15.2929 15.7071L12.2929 12.7071C12.1054 12.5196 12 12.2652 12 12V6C12 5.44772 12.4477 5 13 5Z"
                            fill="currentColor" />
                    </svg>История</button>
            </div>
        </header>
        <main class="layout__main">
            <div class="container">
                <button id="add" class="add">＋ Добавить задание</button>

                <div id="loading" class="loading" aria-live="polite">
                    <span class="spinner"></span>
                    <span>Загрузка</span>
                </div>
                <div id="list"></div>
                <p id="empty" class="hidden">Заданий пока нет</p>
            </div>

        </main>
        <footer class="footer"></footer>
        <div id="modal" class="modal hidden">
            <div class="card">
                <h2 id="title">Новое задание</h2>
                <label>Задание
                    <textarea id="text" rows="3"></textarea>
                </label>
                <label>Повторение
                    <select id="repeat">
                        <option value>Не повторять</option>
                        <option value="days">Через N дней после
                            выполнения</option>
                    </select>
                </label>
                <label id="daysBox" class="hidden">Количество дней
                    <input id="days" type="number" min="1" value="7">
                </label>
                <div class="actions">
                    <button id="cancel">Отмена</button>
                    <button id="remove" class="danger hidden">Удалить</button>
                    <button id="save" class="primary">Добавить</button>
                </div>
            </div>
        </div>
        <div id="confirm" class="modal hidden">
            <div class="card">
                <h2>Удалить задание?</h2>
                <p>Это действие нельзя отменить.</p>
                <div class="actions">
                    <button id="no">Отмена</button>
                    <button id="yes" class="danger">Удалить</button>
                </div>
            </div>
        </div>
        <div id="hist" class="modal hidden">
            <div class="card">
                <div class="head">
                    <h2>История</h2>
                    <button id="close"><svg xmlns="http://www.w3.org/2000/svg"
                            width="100%" height="100%" viewBox="0 0 24 24"
                            fill="none">

                            <g id="SVGRepo_bgCarrier" stroke-width="0" />

                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round"
                                stroke-linejoin="round" />

                            <g id="SVGRepo_iconCarrier"> <path
                                    d="M6.99486 7.00636C6.60433 7.39689 6.60433 8.03005 6.99486 8.42058L10.58 12.0057L6.99486 15.5909C6.60433 15.9814 6.60433 16.6146 6.99486 17.0051C7.38538 17.3956 8.01855 17.3956 8.40907 17.0051L11.9942 13.4199L15.5794 17.0051C15.9699 17.3956 16.6031 17.3956 16.9936 17.0051C17.3841 16.6146 17.3841 15.9814 16.9936 15.5909L13.4084 12.0057L16.9936 8.42059C17.3841 8.03007 17.3841 7.3969 16.9936 7.00638C16.603 6.61585 15.9699 6.61585 15.5794 7.00638L11.9942 10.5915L8.40907 7.00636C8.01855 6.61584 7.38538 6.61584 6.99486 7.00636Z"
                                    fill="#2a2a2a" /> </g>

                        </svg></button>
                </div>
                <div id="historyList"></div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
